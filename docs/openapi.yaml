components:
  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    DataEnvelope:
      type: object
      required:
        - data
      properties:
        data: {}
    ListEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          additionalProperties: true
    tasqex_create_ticketRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        title:
          type: string
          minLength: 1
        status_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        assignee_id:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: "null"
        origin:
          type: string
          enum:
            - manual
            - api
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
        kind:
          type: string
          const: task
        body:
          type: string
        contact: {}
      required:
        - title
        - kind
        - contact
      additionalProperties: false
    tasqex_update_ticketRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        title:
          type: string
          minLength: 1
        body:
          type:
            - string
            - "null"
        status_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        assignee_id:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: "null"
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      additionalProperties: false
    tasqex_create_ticket_commentRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 32000
      required:
        - body
      additionalProperties: false
    tasqex_update_ticket_commentRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 32000
      required:
        - body
      additionalProperties: false
    tasqex_set_board_lane_orderRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        ticket_ids:
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        visible_ticket_ids:
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        removed_ticket_ids:
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - ticket_ids
      additionalProperties: false
    tasqex_seed_manual_board_ordersRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        lanes:
          type: object
          propertyNames:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          additionalProperties:
            type: array
            items:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        only_if_empty:
          type: boolean
        merge_visible:
          type: boolean
      required:
        - lanes
      additionalProperties: false
    tasqex_move_ticket_on_boardRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        ticket_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        from_status_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        to_status_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        target_ticket_ids:
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        source_ticket_ids:
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        filter_context:
          type: object
          properties:
            source_visible_ticket_ids:
              type: array
              items:
